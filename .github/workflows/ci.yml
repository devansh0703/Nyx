name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all JS
        run: |
          fail=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: Run unit tests
        run: npm test

  build:
    name: Build (linux)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg rpm \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xauth xvfb libasound2t64 ffmpeg

      - name: Build Linux artifacts (dry-run publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:linux -- --publish never

      - name: Verify artifacts exist
        run: |
          ls -la dist/
          test -n "$(find dist -name '*.AppImage' -o -name '*.deb')" || {
            echo "ERROR: no Linux artifacts produced"; exit 1;
          }
